name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - name: offline demo from committed tag cache
        run: python -m adlens run --api-dir fixtures/api --folder fixtures/folder --genres fixtures/genres.json --cache fixtures/tag_cache.jsonl --offline --vision --out out
